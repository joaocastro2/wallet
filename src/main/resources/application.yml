spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wallet_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate

  brapi:
    api:
      base-url: https://brapi.dev/api
      token: ${BRAPI_API_TOKEN}

  wallet:
    scheduling:
      fixed-delay: 60000